name: Build debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships the Android SDK; this caches Gradle between runs.
      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/searchlight-${{ github.run_number }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: searchlight-debug-${{ github.run_number }}
          path: out/*.apk
          retention-days: 30

      # A rolling "debug-latest" pre-release so the newest APK is always one tap away from your
      # phone's browser, no zip to unpack. Skipped for pull requests.
      - name: Publish rolling release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug-latest --cleanup-tag --yes || true
          gh release create debug-latest out/*.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Searchlight debug build #${{ github.run_number }}" \
            --notes "Built from \`${GITHUB_REF_NAME}\` @ ${GITHUB_SHA::7}. Download the .apk below on your phone and open it to install."
