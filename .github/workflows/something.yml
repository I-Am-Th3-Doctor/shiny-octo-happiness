name: Something debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: something-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships the Android SDK; this caches Gradle between runs.
      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/something-${{ github.run_number }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: something-debug-${{ github.run_number }}
          path: out/*.apk
          retention-days: 30

      # A rolling "something-latest" pre-release, separate from Searchlight's "debug-latest",
      # so the newest APK is always one tap away in your phone's browser.
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete something-latest --cleanup-tag --yes || true
          gh release create something-latest out/*.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Something debug build #${{ github.run_number }}" \
            --notes "Built from \`${GITHUB_REF_NAME}\` @ ${GITHUB_SHA::7}. Download the .apk below on your phone and open it to install."
