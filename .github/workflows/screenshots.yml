name: Screenshots

# Boots an emulator, runs ScreenshotTest, and publishes the images as the rolling
# "screenshots-latest" release. Only on demand: a commit message containing [screenshots],
# or a manual run.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screenshots]')
    runs-on: ubuntu-24.04
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build APKs
        run: ./gradlew assembleDebug :app:assembleDebugAndroidTest

      # A real third-party icon pack for the icon-pack tests: Arcticons, from F-Droid. Best effort:
      # if F-Droid can't be reached the Arcticons test is skipped (the repo's test pack still runs).
      - name: Download Arcticons (icon pack) from F-Droid
        continue-on-error: true
        run: |
          VC=$(curl -fsS https://f-droid.org/api/v1/packages/com.donnnno.arcticons | python3 -c 'import json,sys; print(json.load(sys.stdin)["suggestedVersionCode"])')
          curl -fsSL -o arcticons.apk "https://f-droid.org/repo/com.donnnno.arcticons_${VC}.apk"
          ls -l arcticons.apk

      # Android 15 (edge-to-edge enforced). "Folded" is a phone-sized screen (411dp wide, like the
      # Razr's outer display); "unfolded" resizes the same emulator's display to a foldable inner
      # screen (1840x2208 @ 420dpi, ~700dp wide). Each is captured at normal and 1.3x text.
      # (The runner's emulator has no Pixel Fold device definition, so the posture is simulated.)
      # Each posture boots its own emulator: one emulator through both runs (230-odd tests) wore
      # out its graphics and memory and died part way through the second.
      - name: Capture on emulator (Android 15, folded)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot -wipe-data -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb shell wm size
            adb install -r testiconpack/build/outputs/apk/debug/testiconpack-debug.apk
            adb push testiconpack/build/outputs/apk/debug/testiconpack-debug.apk /data/local/tmp/testiconpack.apk
            if [ -f arcticons.apk ]; then adb install -r arcticons.apk || echo "Arcticons didn't install"; else echo "No Arcticons download"; fi
            rm -f /tmp/device-tests-failed
            adb logcat -b crash -c || true
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.shotPrefix=folded || touch /tmp/device-tests-failed
            timeout 60 adb logcat -d -b crash | tail -n 150 || true
            timeout 60 adb logcat -d -s Watchdog:E lowmemorykiller:* lmkd:* | tail -n 120 || true
            # A stuck test's thread dump: where the render thread was waiting.
            timeout 30 adb root || true; timeout 60 adb wait-for-device || true
            timeout 60 adb shell 'for f in $(ls -t /data/anr/trace_* 2>/dev/null | head -2); do echo "== $f"; grep -A45 -E "^\"(main|RenderThread)\"" "$f" | head -120; done' || true
            timeout 60 adb shell 'cat /sdcard/Download/searchlight-shots/watchdog-*.txt' || true
            mkdir -p shots
            for i in 1 2 3 4 5 6; do timeout 300 adb pull /sdcard/Download/searchlight-shots/. shots/ && break; echo "adb pull failed, retrying"; adb reconnect || true; timeout 60 adb wait-for-device; sleep 5; done
            ls shots | wc -l

      # "Unfolded": the same kind of emulator with its display resized to a foldable's inner screen.
      # In two halves, the weather's tests on an emulator of their own: at this size one emulator
      # through all of them gave out part way.
      - name: Capture on emulator (Android 15, unfolded, all but the weather)
        if: always()
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot -wipe-data -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r testiconpack/build/outputs/apk/debug/testiconpack-debug.apk
            adb push testiconpack/build/outputs/apk/debug/testiconpack-debug.apk /data/local/tmp/testiconpack.apk
            if [ -f arcticons.apk ]; then adb install -r arcticons.apk || echo "Arcticons didn't install"; else echo "No Arcticons download"; fi
            adb shell wm size 1840x2208
            adb shell wm density 420
            # Wait until the new size has really reached the display (a slow emulator can take a
            # while), so it doesn't land mid-test and restart the activity under the first one.
            for i in $(seq 1 60); do adb shell dumpsys window displays | grep -q "cur=1840x2208" && break; sleep 1; done
            adb shell input keyevent KEYCODE_HOME
            sleep 5
            adb shell wm size
            adb logcat -b crash -c || true
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.shotPrefix=unfolded -Pandroid.testInstrumentationRunnerArguments.notClass=io.github.iamth3doctor.searchlight.WeatherSceneDeviceTest || touch /tmp/device-tests-failed
            timeout 60 adb logcat -d -b crash | tail -n 150 || true
            timeout 60 adb logcat -d -s Watchdog:E lowmemorykiller:* lmkd:* | tail -n 120 || true
            # A stuck test's thread dump: where the render thread was waiting.
            timeout 30 adb root || true; timeout 60 adb wait-for-device || true
            timeout 60 adb shell 'for f in $(ls -t /data/anr/trace_* 2>/dev/null | head -2); do echo "== $f"; grep -A45 -E "^\"(main|RenderThread)\"" "$f" | head -120; done' || true
            timeout 60 adb shell 'cat /sdcard/Download/searchlight-shots/watchdog-*.txt' || true
            mkdir -p shots
            for i in 1 2 3 4 5 6; do timeout 300 adb pull /sdcard/Download/searchlight-shots/. shots/ && break; echo "adb pull failed, retrying"; adb reconnect || true; timeout 60 adb wait-for-device; sleep 5; done
            ls shots | wc -l

      - name: Capture on emulator (Android 15, unfolded, the weather)
        if: always()
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot -wipe-data -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r testiconpack/build/outputs/apk/debug/testiconpack-debug.apk
            adb push testiconpack/build/outputs/apk/debug/testiconpack-debug.apk /data/local/tmp/testiconpack.apk
            if [ -f arcticons.apk ]; then adb install -r arcticons.apk || echo "Arcticons didn't install"; else echo "No Arcticons download"; fi
            adb shell wm size 1840x2208
            adb shell wm density 420
            # Wait until the new size has really reached the display (a slow emulator can take a
            # while), so it doesn't land mid-test and restart the activity under the first one.
            for i in $(seq 1 60); do adb shell dumpsys window displays | grep -q "cur=1840x2208" && break; sleep 1; done
            adb shell input keyevent KEYCODE_HOME
            sleep 5
            adb shell wm size
            adb logcat -b crash -c || true
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.shotPrefix=unfolded -Pandroid.testInstrumentationRunnerArguments.class=io.github.iamth3doctor.searchlight.WeatherSceneDeviceTest || touch /tmp/device-tests-failed
            timeout 60 adb logcat -d -b crash | tail -n 150 || true
            timeout 60 adb logcat -d -s Watchdog:E lowmemorykiller:* lmkd:* | tail -n 120 || true
            # A stuck test's thread dump: where the render thread was waiting.
            timeout 30 adb root || true; timeout 60 adb wait-for-device || true
            timeout 60 adb shell 'for f in $(ls -t /data/anr/trace_* 2>/dev/null | head -2); do echo "== $f"; grep -A45 -E "^\"(main|RenderThread)\"" "$f" | head -120; done' || true
            timeout 60 adb shell 'cat /sdcard/Download/searchlight-shots/watchdog-*.txt' || true
            mkdir -p shots
            for i in 1 2 3 4 5 6; do timeout 300 adb pull /sdcard/Download/searchlight-shots/. shots/ && break; echo "adb pull failed, retrying"; adb reconnect || true; timeout 60 adb wait-for-device; sleep 5; done
            ls shots
            cat shots/widgets-*.txt || true
            cat shots/watchdog-*.txt || true
            test ! -f /tmp/device-tests-failed

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ github.run_number }}
          path: |
            shots/*.png
            shots/*.txt

      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: device-test-reports-${{ github.run_number }}
          path: app/build/outputs/androidTest-results/
          if-no-files-found: ignore

      - name: Publish rolling screenshots release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only a complete set replaces the last one: a copy off the emulator cut short leaves it as it was.
          on=$(adb shell ls /sdcard/Download/searchlight-shots 2>/dev/null | grep -c '\.png' || true)
          here=$(ls shots/*.png 2>/dev/null | wc -l)
          echo "screenshots: $here copied, $on on the emulator"
          if [ "$here" -lt 100 ] || { [ "$on" -gt 0 ] && [ "$here" -lt "$on" ]; }; then
            echo "::error::only $here screenshots copied off the emulator; the last release stays"; exit 1
          fi
          # Deleting a release of ~300 files in one call can time out (HTTP 502) and leave it in
          # place, so empty it a file at a time first, then delete it and its tag, retrying.
          for try in 1 2 3; do
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/screenshots-latest" --jq .id 2>/dev/null) || break
            for a in $(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$id/assets" --jq '.[].id'); do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$a" || true
            done
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" || sleep 15
          done
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/screenshots-latest" || true
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/screenshots-latest" --jq .id >/dev/null 2>&1; then
            echo "::error::the old screenshots-latest release could not be removed"; exit 1
          fi
          gh release create screenshots-latest shots/*.png $(ls shots/*.txt 2>/dev/null) \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Screenshots #${{ github.run_number }} (${GITHUB_SHA::7})" \
            --notes "Emulator: Android 15; folded = 411dp phone screen, unfolded = 1840x2208 @ 420dpi; font 1.0 and 1.3. From \`${GITHUB_REF_NAME}\` @ ${GITHUB_SHA::7}."
