name: Screenshots

# Boots an emulator, runs ScreenshotTest, and publishes the images as the rolling
# "screenshots-latest" release. Only on demand: a commit message containing [screenshots],
# or a manual run.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screenshots]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      # Android 15 (edge-to-edge enforced). "Folded" is a phone-sized screen (411dp wide, like the
      # Razr's outer display); "unfolded" resizes the same emulator's display to a foldable inner
      # screen (1840x2208 @ 420dpi, ~700dp wide). Each is captured at normal and 1.3x text.
      # (The runner's emulator has no Pixel Fold device definition, so the posture is simulated.)
      - name: Capture on emulator (Android 15, folded + unfolded)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb shell wm size
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.shotPrefix=folded
            adb shell wm size 1840x2208
            adb shell wm density 420
            sleep 5
            adb shell wm size
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.shotPrefix=unfolded
            adb shell wm size reset
            adb shell wm density reset
            mkdir -p shots
            for i in 1 2 3; do adb pull /sdcard/Download/searchlight-shots/. shots/ && break; echo "adb pull failed, retrying"; sleep 3; done
            ls shots

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ github.run_number }}
          path: shots/*.png

      - name: Publish rolling screenshots release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete screenshots-latest --cleanup-tag --yes || true
          gh release create screenshots-latest shots/*.png \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Screenshots #${{ github.run_number }} (${GITHUB_SHA::7})" \
            --notes "Emulator: Android 15; folded = 411dp phone screen, unfolded = 1840x2208 @ 420dpi; font 1.0 and 1.3. From \`${GITHUB_REF_NAME}\` @ ${GITHUB_SHA::7}."
