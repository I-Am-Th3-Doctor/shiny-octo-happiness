name: Screenshots

# Boots an emulator, runs ScreenshotTest, and publishes the images as the rolling
# "screenshots-latest" release. Only on demand: a commit message containing [screenshots],
# or a manual run.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screenshots]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Capture on emulator (Pixel 7 size, Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            ./gradlew connectedDebugAndroidTest
            mkdir -p shots
            adb pull /sdcard/Download/searchlight-shots/. shots/
            ls -la shots

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ github.run_number }}
          path: shots/*.png

      - name: Publish rolling screenshots release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete screenshots-latest --cleanup-tag --yes || true
          gh release create screenshots-latest shots/*.png \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Screenshots #${{ github.run_number }} (${GITHUB_SHA::7})" \
            --notes "Emulator: Pixel 7 size, Android 14. From \`${GITHUB_REF_NAME}\` @ ${GITHUB_SHA::7}."
